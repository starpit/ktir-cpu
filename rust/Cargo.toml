[package]
name = "ktir-cpu"
version = "0.1.0"
edition = "2024"
description = "Rust port of the KTIR CPU validation interpreter (RFC 0682)"

# The default build is intentionally dependency-free: portable, instant, and the
# parity oracle. Acceleration is opt-in via the `accelerate` feature.
#
# Future (not gating the default build):
#   ndarray -> Tile storage (the tile.rs dtype fork); half -> f16; regex -> parser.
[features]
default = []

# `blas` is the umbrella capability: it routes linalg matmul/dot through
# `cblas_sgemm`. The call is backend-agnostic — every BLAS library exposes the
# same cblas ABI — so a PROVIDER feature below must also be enabled to pick which
# library gets linked. Enabling `blas` alone fails to link (no provider). The
# naive Rust matmul remains the cross-platform default and the parity oracle.
blas = ["dep:cblas-sys", "dep:blas-src"]

# Providers — pick exactly one. Each implies `blas` and selects the library:
#   accelerate : macOS only, Apple's Accelerate (AMX-backed). cargo …--features accelerate
#   openblas   : portable; builds OpenBLAS from source (needs a C/Fortran toolchain).
#                For a system libopenblas-dev instead, use `openblas-system`.
#   openblas-system : links the system OpenBLAS (apt install libopenblas-dev).
#   mkl        : x86_64, Intel MKL (downloaded by intel-mkl-src).
#   blis       : portable BLIS (good on AMD).
accelerate      = ["blas", "blas-src/accelerate"]
openblas        = ["blas", "blas-src/openblas"]
openblas-system = ["blas", "blas-src/openblas", "openblas-src/system"]
mkl             = ["blas", "blas-src/intel-mkl"]
blis            = ["blas", "blas-src/blis"]

[dependencies]
# All optional — only pulled in by a provider feature. blas-src links the chosen
# library; cblas-sys provides the cblas_sgemm declaration. `openblas-src` is a
# direct optional dep purely so `openblas-system` can flip its `system` feature.
blas-src = { version = "0.10", optional = true, default-features = false }
openblas-src = { version = "0.10", optional = true, default-features = false }
cblas-sys = { version = "0.1", optional = true }

[lib]
name = "ktir_cpu"
path = "src/lib.rs"
